name: RazeKit DEV Continuous Builder

# A scheduled GitHub Actions job, not a persistent 24/7 worker: each run makes
# at most one bounded increment and exits. The persistent builder is System A
# (src/ops-supervisor.js --system=builder) on the control plane.

on:
  schedule:
    # Hourly checks with bounded per-run output to stay within free-tier model limits.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # GitHub Models through the workflow's own token: the no-cost provider used
  # when GROQ_API_KEY is not configured.
  models: read

concurrency:
  group: razekit-dev-continuous-builder
  cancel-in-progress: false

jobs:
  build-one-increment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout without persisting credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Choose the model provider
        id: provider
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -n "$GROQ_API_KEY" ]; then
            echo "name=groq" >> "$GITHUB_OUTPUT"
            echo "Provider: Groq (GROQ_API_KEY is configured)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "name=github-models" >> "$GITHUB_OUTPUT"
            echo "Provider: GitHub Models via the workflow token (GROQ_API_KEY is not configured)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate, sandbox-test and submit one DEV improvement
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GROQ_MODEL: openai/gpt-oss-120b
          RAZEKIT_AUTOBUILD_PROVIDER: ${{ steps.provider.outputs.name }}
          GITHUB_MODELS_MODEL: openai/gpt-4.1
        run: |
          set -o pipefail
          node scripts/razekit-autobuilder.mjs 2>&1 | tee autobuild.log
          status=${PIPESTATUS[0]}
          { echo; echo '```'; grep '^\[razekit-autobuilder\]' autobuild.log | tail -20; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
