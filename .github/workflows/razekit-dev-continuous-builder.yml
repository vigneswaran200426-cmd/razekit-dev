name: RazeKit DEV Continuous Builder

on:
  schedule:
    # Hourly checks with bounded per-run output to stay within free-tier model limits.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: razekit-dev-continuous-builder
  cancel-in-progress: false

jobs:
  build-one-increment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout without persisting credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate, sandbox-test and submit one DEV improvement
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GROQ_MODEL: openai/gpt-oss-120b
        run: node scripts/razekit-autobuilder.mjs
